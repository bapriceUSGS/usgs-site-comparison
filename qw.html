<body>
<div class="container">

<script>
// ===== QW SITE CONFIGURATION =====
const QW_PARAMS = {

  '00300': { name: 'Dissolved Oxygen', unit: 'mg/L', abbr: 'DO' },
  '00400': { name: 'pH', unit: '', abbr: 'pH' },
  '63680': { name: 'Turbidity', unit: 'FNU', abbr: 'Turb' },
  '00010': { name: 'Water Temperature', unit: '°C', abbr: 'Temp' }
};

const DRAINAGES = [
  { name: "Clark Fork System", sites: [
    { id:"12323233", name:"Blacktail Creek above Grove Gulch, at Butte, MT", params:["00095","63680"] },
    { id:"12323242", name:"Silver Bow Creek at Montana Street, at Butte, MT", params:["00095","63680"] },

    { id:"12323720", name:"Willow Creek at Opportunity, MT", params:["63680"] },
    { id:"12323770", name:"Warm Springs Creek at Warm Springs MT", params:["63680"] },
    { id:"12323800", name:"Clark Fork near Galen MT", params:["00095","63680"] },
    { id:"12324200", name:"Clark Fork at Deer Lodge MT", params:["00095","63680"] },
    { id:"12324400", name:"Clark Fork ab Little Blackfoot R nr Garrison MT", params:["00095","63680"] },
    { id:"12340500", name:"Clark Fork above Missoula MT", params:["00095","63680"] }
  ]},
  { name: "Kootenai", sites: [
    { id:"12301933", name:"Kootenai River bl Libby Dam nr Libby MT", params:["00095","00300","00400","63680"] }
  ]},
  { name: "Madison River", sites: [
    { id:"06036905", name:"Firehole River near West Yellowstone MT", params:["00095"] },
    { id:"06037100", name:"Gibbon River at Madison Jct, YNP", params:["00095"] },
    { id:"06037500", name:"Madison River near West Yellowstone, MT", params:["00095"] },
    { id:"06040000", name:"Madison River near Cameron MT", params:["00300"] },
    { id:"06040050", name:"Madison River at Ennis, MT", params:["00300"] },
    { id:"06041500", name:"Madison River near Norris MT", params:["00300"] }
  ]},
  { name: "Yellowstone", sites: [
    { id:"06187915", name:"Soda Butte Cr at Park Bndry at Silver Gate", params:["63680"] },
    { id:"06191500", name:"Yellowstone River at Corwin Springs MT", params:["00095"] },
    { id:"06192978", name:"Shields River bl SF Shields River nr Wilsall, MT", params:["00095","00300","00400","63680"] },
    { id:"06329500", name:"Yellowstone River near Sidney MT", params:["63680"] }
  ]},
  { name: "Tongue/Powder", sites: [
    { id:"06306300", name:"Tongue River at State Line nr Decker MT", params:["00095"] },
    { id:"06307500", name:"Tongue River at Tongue R Dam nr Decker MT", params:["00095"] },
    { id:"06307616", name:"Tongue R at Birney Day School Br nr Birney MT", params:["00095"] },
    { id:"06307830", name:"Tongue R bl Brandenberg bridge nr Ashland MT", params:["00095"] },
    { id:"06308500", name:"Tongue River at Miles City, MT", params:["00095"] },
    { id:"06324500", name:"Powder River at Moorhead MT", params:["00095"] }
  ]},
  { name: "Missouri/Milk", sites: [
    { id:"06174500", name:"Milk River at Nashua MT", params:["00095","00300","00400","63680"] },
    { id:"06177000", name:"Missouri River near Wolf Point MT", params:["00095","00300","00400","63680"] },
    { id:"06178500", name:"East Poplar River at international boundary", params:["00095"] }
  ]},
  { name: "Snake River WY", sites: [
    { id:"13013650", name:"SNAKE RIVER AT MOOSE, WY", params:["00095","00300","00400"] },
    { id:"13016450", name:"FISH CREEK AT WILSON, WY", params:["00095","00300","00400","63680"] },
    { id:"13018350", name:"FLAT CREEK BELOW CACHE CREEK, NEAR JACKSON, WY", params:["63680"] },
    { id:"13018750", name:"SNAKE RIVER BELOW FLAT CREEK, NEAR JACKSON, WY", params:["00095","00300","00400"] }
  ]},
  { name: "Green River/Other WY", sites: [
    { id:"06427850", name:"BELLE FOURCHE RIVER AT DEVILS TOWER, WY", params:["00095","00300","00400"] },
    { id:"06670500", name:"LARAMIE RIVER NEAR FORT LARAMIE, WY", params:["00095","00300","00400"] },
    { id:"09217000", name:"GREEN RIVER NEAR GREEN RIVER, WY", params:["00095"] },
    { id:"09219200", name:"Blacks Fork above Smiths Fork, near Lyman, WY", params:["00095"] },
    { id:"09258980", name:"MUDDY CREEK BELOW YOUNG DRAW, NEAR BAGGS, WY", params:["00095"] }
  ]}
];

// ===== STATE =====
let currentData = {};  // siteId -> { paramCode -> { value, dateTime } }
let historicalData = {}; // siteId -> { paramCode -> [{dateTime, value}] }
let chartInstance = null;

// ===== FETCH FUNCTIONS =====
async function fetchQW(siteIds, period='PT2H') {
  const url = `https://waterservices.usgs.gov/nwis/iv/?format=json&sites=${siteIds.join(',')}&parameterCd=00095,00300,00400,63680,00010&period=${period}&siteStatus=active`;
  const resp = await fetch(url);
  if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
  return await resp.json();
}

async function fetchQW7Day(siteId) {
  const url = `https://waterservices.usgs.gov/nwis/iv/?format=json&sites=${siteId}&parameterCd=00095,00300,00400,63680,00010&period=P7D&siteStatus=active`;
  const resp = await fetch(url);
  if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
  return await resp.json();
}

function parseIVResponse(json) {
  const result = {};
  if (!json.value || !json.value.timeSeries) return result;
  for (const ts of json.value.timeSeries) {
    const siteCode = ts.sourceInfo.siteCode[0].value;
    const paramCode = ts.variable.variableCode[0].value;
    if (!result[siteCode]) result[siteCode] = {};
    const values = ts.values[0].value;
    if (values && values.length > 0) {
      const last = values[values.length - 1];
      result[siteCode][paramCode] = {
        value: parseFloat(last.value),
        dateTime: last.dateTime
      };
    }
  }
  return result;
}
function parse7DayResponse(json) {
  const result = {};
  if (!json.value || !json.value.timeSeries) return result;
  for (const ts of json.value.timeSeries) {
    const paramCode = ts.variable.variableCode[0].value;
    const values = ts.values[0].value;
    if (values && values.length > 0) {
      result[paramCode] = values
        .filter(v => v.value !== '' && v.value !== '-999999')
        .map(v => ({ dateTime: new Date(v.dateTime), value: parseFloat(v.value) }));
    }
  }
  return result;
}

// ===== ANOMALY DETECTION =====
// Simple spike detection: compare current value to 7-day data fetched alongside
// We'll use a simpler approach: fetch P7D and check if latest is >2x the median
async function detectSpikes(siteId, currentVals) {
  // This is called per-site when we have 7-day data
  const spikes = [];
  if (!historicalData[siteId]) return spikes;
  for (const [param, series] of Object.entries(historicalData[siteId])) {
    if (!series || series.length < 10) continue;
    const vals = series.map(v => v.value).filter(v => !isNaN(v) && v >= 0);
    if (vals.length < 10) continue;
    vals.sort((a, b) => a - b);
    const median = vals[Math.floor(vals.length / 2)];
    const current = currentVals[param]?.value;
    if (current === undefined || isNaN(current) || current < 0) continue;
    // Spike if current > 2x median or < 0.3x median (for things like DO drop)
    if (median > 0 && (current > median * 2 || current < median * 0.3)) {
      spikes.push({ param, current, median, ratio: (current / median).toFixed(2) });
    }
  }
  return spikes;
}

// ===== INTER-SITE QW COMPARISON =====
// Define upstream/downstream relationships for QW sites
const QW_RELATIONSHIPS = [
  {sites:["12323800","12324200","12324400","12340500"], name:"Clark Fork mainstem QW"},
  {sites:["06306300","06307500","06307616","06307830","06308500"], name:"Tongue River QW"},
  {sites:["13013650","13018750"], name:"Snake River WY QW"},
];

function detectInterSiteAnomalies(currentData, historicalData) {
  const anomalies = [];

  for (const rel of QW_RELATIONSHIPS) {
    // For each pair of adjacent QW sites, compare parameter ratios
    for (let i = 0; i < rel.sites.length - 1; i++) {
      const upId = rel.sites[i];
      const dnId = rel.sites[i+1];
      const upData = currentData[upId];
      const dnData = currentData[dnId];
      if (!upData || !dnData) continue;

      // Compare shared parameters
      for (const paramCode of Object.keys(QW_PARAMS)) {
        const upVal = upData[paramCode]?.value;
        const dnVal = dnData[paramCode]?.value;
        if (upVal === undefined || dnVal === undefined) continue;
        if (upVal <= 0 && dnVal <= 0) continue;

        // Get 7-day medians for both sites to establish "normal" relationship
        const upHist = historicalData[upId]?.[paramCode];
        const dnHist = historicalData[dnId]?.[paramCode];
        if (!upHist || !dnHist || upHist.length < 20 || dnHist.length < 20) continue;

        const upMedian = getMedian(upHist.map(v=>v.value));
        const dnMedian = getMedian(dnHist.map(v=>v.value));
        if (upMedian <= 0) continue;

        // Historical ratio between sites
        const histRatio = dnMedian / upMedian;
        // Current ratio
        const currentRatio = dnVal / upVal;

        // Flag if relationship has changed significantly (>40%)
        if (histRatio > 0) {
          const ratioPctChange = ((currentRatio - histRatio) / histRatio) * 100;
          if (Math.abs(ratioPctChange) >= 40) {
            const upName = findSiteName(upId);
            const dnName = findSiteName(dnId);
            const pInfo = QW_PARAMS[paramCode];
            anomalies.push({
              siteId: dnId,
              type: `${pInfo.abbr} relationship changed vs upstream`,
              detail: `${dnName} ${pInfo.abbr} is ${currentRatio.toFixed(2)}x of ${upName} today (${dnVal.toFixed(1)} / ${upVal.toFixed(1)} ${pInfo.unit}), but normally it's ${histRatio.toFixed(2)}x. ${Math.abs(ratioPctChange).toFixed(0)}% ${ratioPctChange>0?"higher":"lower"} than expected.`
            });
          }
        }
      }
    }
  }

  // Parameter correlation checks within each site
  // Normal: flow↑ + temp↓ = turbidity↑; SC generally inverse to flow
  for (const [siteId, data] of Object.entries(currentData)) {
    const hist = historicalData[siteId];
    if (!hist) continue;

    const tempNow = data['00010']?.value;
    const turbNow = data['63680']?.value;
    const scNow = data['00095']?.value;
    const doNow = data['00300']?.value;

    const tempHist = hist['00010'] ? getMedian(hist['00010'].map(v=>v.value)) : null;
    const turbHist = hist['63680'] ? getMedian(hist['63680'].map(v=>v.value)) : null;
    const scHist = hist['00095'] ? getMedian(hist['00095'].map(v=>v.value)) : null;
    const doHist = hist['00300'] ? getMedian(hist['00300'].map(v=>v.value)) : null;

    const siteName = findSiteName(siteId);

    // Check: Temp up significantly but DO not dropping (sensor issue?)
    if (tempNow && doNow && tempHist && doHist && tempHist > 0 && doHist > 0) {
      const tempPct = ((tempNow - tempHist) / tempHist) * 100;
      const doPct = ((doNow - doHist) / doHist) * 100;
      // If temp rose >20% but DO didn't drop, flag
      if (tempPct > 20 && doPct > -5) {
        anomalies.push({
          siteId,
          type: "Temp/DO correlation anomaly",
          detail: `${siteName}: Temperature is ${tempPct.toFixed(0)}% above 7-day median but DO hasn't decreased (${doPct.toFixed(0)}% change). Normally warmer water = lower DO.`
        });
      }
    }

    // Check: Turbidity spike without corresponding SC change (possible sensor fouling)
    if (turbNow && scNow && turbHist && scHist && turbHist > 0 && scHist > 0) {
      const turbPct = ((turbNow - turbHist) / turbHist) * 100;
      const scPct = ((scNow - scHist) / scHist) * 100;
      // If turbidity doubled but SC barely changed, could be sensor fouling
      if (turbPct > 100 && Math.abs(scPct) < 20) {
        anomalies.push({
          siteId,
          type: "Possible sensor fouling (turbidity)",
          detail: `${siteName}: Turbidity is ${turbPct.toFixed(0)}% above 7-day median (${turbNow.toFixed(1)} vs ${turbHist.toFixed(1)} FNU) but SC is stable (${scPct.toFixed(0)}% change). Isolated turbidity spike may indicate sensor fouling.`
        });
      }
    }
  }

  return anomalies;
}

function getMedian(arr) {
  const sorted = arr.filter(v => !isNaN(v) && v >= 0).sort((a,b) => a-b);
  if (!sorted.length) return 0;
  return sorted[Math.floor(sorted.length/2)];
}

function findSiteName(siteId) {
  for (const d of DRAINAGES) {
    const s = d.sites.find(s => s.id === siteId);
    if (s) return s.name;
  }
  return siteId;
}

// ===== RENDERING =====
function setStatus(msg, type='') {
  const app = document.getElementById('app');
  let bar = document.getElementById('statusBar');
  if (!bar) {
    bar = document.createElement('div');
    bar.id = 'statusBar';
    bar.className = 'status-bar';
    app.prepend(bar);
  }
  bar.className = `status-bar ${type}`;
  bar.textContent = msg;
}

async function loadData() {
  const app = document.getElementById('app');
  app.innerHTML = '';
  setStatus('Fetching water quality data from USGS...', 'loading');

  const allSiteIds = DRAINAGES.flatMap(d => d.sites.map(s => s.id));

  try {
    // Fetch current values (last 2 hours)
    const batchSize = 20;
    for (let i = 0; i < allSiteIds.length; i += batchSize) {
      const batch = allSiteIds.slice(i, i + batchSize);
      const json = await fetchQW(batch, 'PT2H');
      const parsed = parseIVResponse(json);
      Object.assign(currentData, parsed);
    }

    // Also fetch 7-day data for spike detection (in batches)
    setStatus('Analyzing 7-day trends for anomaly detection...', 'loading');
    for (let i = 0; i < allSiteIds.length; i += batchSize) {
      const batch = allSiteIds.slice(i, i + batchSize);
      const url = `https://waterservices.usgs.gov/nwis/iv/?format=json&sites=${batch.join(',')}&parameterCd=00095,00300,00400,63680,00010&period=P7D&siteStatus=active`;
      const resp = await fetch(url);
      if (resp.ok) {
        const json = await resp.json();
        if (json.value && json.value.timeSeries) {
          for (const ts of json.value.timeSeries) {
            const siteCode = ts.sourceInfo.siteCode[0].value;
            const paramCode = ts.variable.variableCode[0].value;
            if (!historicalData[siteCode]) historicalData[siteCode] = {};
            const values = ts.values[0].value;
            if (values && values.length > 0) {
              historicalData[siteCode][paramCode] = values
                .filter(v => v.value !== '' && v.value !== '-999999')
                .map(v => ({ dateTime: new Date(v.dateTime), value: parseFloat(v.value) }));
            }
          }
        }
      }
    }
    // Detect spikes for all sites
    const spikesBySite = {};
    let totalSpikes = 0;
    for (const drainage of DRAINAGES) {
      for (const site of drainage.sites) {
        if (currentData[site.id]) {
          const spikes = await detectSpikes(site.id, currentData[site.id]);
          if (spikes.length > 0) {
            spikesBySite[site.id] = spikes;
            totalSpikes += spikes.length;
          }
        }
      }
    }

    // Count sites reporting
    const sitesReporting = Object.keys(currentData).length;

    // Run inter-site QW comparisons and correlation checks
    const interSiteAnomalies = detectInterSiteAnomalies(currentData, historicalData);
    // Merge inter-site anomalies into spikesBySite for display
    for (const a of interSiteAnomalies) {
      if (!spikesBySite[a.siteId]) spikesBySite[a.siteId] = [];
      spikesBySite[a.siteId].push({param:'intersite', current:0, median:0, ratio:'', type:a.type, detail:a.detail});
      totalSpikes++;
    }

    setStatus(`Data loaded: ${sitesReporting} of ${allSiteIds.length} sites reporting. ${totalSpikes} anomalies detected.`, totalSpikes > 0 ? 'error' : 'success');

    // Summary cards
    const cardsDiv = document.createElement('div');
    cardsDiv.className = 'summary-cards';
    cardsDiv.innerHTML = `
      <div class="summary-card card-ok"><div class="number">${sitesReporting}</div><div class="label">Sites Reporting</div></div>
      <div class="summary-card"><div class="number">${allSiteIds.length - sitesReporting}</div><div class="label">No Data</div></div>
      <div class="summary-card ${totalSpikes > 0 ? 'card-critical' : 'card-ok'}"><div class="number">${totalSpikes}</div><div class="label">Spike Alerts</div></div>
    `;
    app.appendChild(cardsDiv);

    // Render drainage sections
    for (const drainage of DRAINAGES) {
      const section = document.createElement('div');
      section.className = 'drainage-section';

      const drainageSpikes = drainage.sites.filter(s => spikesBySite[s.id]).length;
      section.innerHTML = `
        <div class="drainage-header" onclick="this.nextElementSibling.classList.toggle('hidden')">
          <span>${drainage.name} (${drainage.sites.length} sites)</span>
          <span class="badge ${drainageSpikes > 0 ? 'badge-alert' : 'badge-ok'}">${drainageSpikes > 0 ? drainageSpikes + ' alert' + (drainageSpikes>1?'s':'') : 'OK'}</span>
        </div>
        <div class="drainage-body">
          <table class="site-table">
            <thead>
              <tr>
                <th>Site Name</th>
                <th>Site #</th>
                <th style="text-align:right">SC (µS/cm)</th>
                <th style="text-align:right">DO (mg/L)</th>
                <th style="text-align:right">pH</th>
                <th style="text-align:right">Turb (FNU)</th>
                <th style="text-align:right">Temp (°C)</th>
                <th>Time</th>
              </tr>
            </thead>
            <tbody>
              ${drainage.sites.map(site => renderSiteRow(site, spikesBySite)).join('')}
            </tbody>
          </table>
          ${renderDrainageAlerts(drainage, spikesBySite)}
        </div>
      `;
      app.appendChild(section);
    }

  } catch (err) {
    setStatus(`Error fetching data: ${err.message}`, 'error');
    console.error(err);
  }
}
function renderDrainageAlerts(drainage, spikesBySite) {
  let alerts = [];
  for (const site of drainage.sites) {
    const siteAlerts = spikesBySite[site.id] || [];
    for (const a of siteAlerts) {
      if (a.type) {
        alerts.push(`<div style="border-left:3px solid #dc2626;padding:6px 12px;margin:4px 0;background:#fef2f2;font-size:0.82em;border-radius:0 4px 4px 0"><strong>${site.name} (${site.id})</strong> — ${a.type}: ${a.detail || `${QW_PARAMS[a.param]?.abbr||a.param} at ${a.current?.toFixed?.(1)} vs median ${a.median?.toFixed?.(1)} (${a.ratio}x)`}</div>`);
      } else if (a.param !== 'intersite') {
        alerts.push(`<div style="border-left:3px solid #d97706;padding:6px 12px;margin:4px 0;background:#fffbeb;font-size:0.82em;border-radius:0 4px 4px 0"><strong>${site.name} (${site.id})</strong> — ⚠ ${QW_PARAMS[a.param]?.abbr||a.param} spike: ${a.current?.toFixed?.(1)} vs 7-day median ${a.median?.toFixed?.(1)} (${a.ratio}x normal)</div>`);
      }
    }
  }
  if (!alerts.length) return '';
  return `<div style="margin-top:10px">${alerts.join('')}</div>`;
}

function renderSiteRow(site, spikesBySite) {
  const data = currentData[site.id] || {};
  const hasSpike = spikesBySite[site.id];
  const flagged = hasSpike ? 'flagged' : '';

  function cellVal(paramCode) {
    if (!site.params.includes(paramCode) && paramCode !== '00010') {
      return '<td class="val-na">—</td>';
    }
    const d = data[paramCode];
    if (!d || isNaN(d.value) || d.value < -900000) return '<td class="val-na">N/A</td>';
    // Check if this param is spiking
    const isSpike = hasSpike && hasSpike.find(s => s.param === paramCode);
    const cls = isSpike ? 'val-num spike-flag' : 'val-num';
    const prefix = isSpike ? '⚠ ' : '';
    return `<td class="${cls}">${prefix}${d.value.toFixed(paramCode === '00400' ? 2 : 1)}</td>`;
  }

  // Get most recent timestamp from any parameter
  let latestTime = '';
  for (const p of Object.values(data)) {
    if (p && p.dateTime) {
      const t = new Date(p.dateTime);
      const timeStr = t.toLocaleTimeString('en-US', {hour:'2-digit', minute:'2-digit', hour12:false});
      if (!latestTime || t > new Date(latestTime)) latestTime = timeStr;
    }
  }

  return `<tr class="${flagged}" onclick="showGraph('${site.id}','${site.name.replace(/'/g,"\\'")}')">
    <td>${site.name}</td>
    <td style="font-family:monospace;font-size:0.8em">${site.id}</td>
    ${cellVal('00095')}
    ${cellVal('00300')}
    ${cellVal('00400')}
    ${cellVal('63680')}
    ${cellVal('00010')}
    <td style="font-size:0.8em;color:#64748b">${latestTime || '—'}</td>
  </tr>`;
}

// ===== GRAPH MODAL =====
async function showGraph(siteId, siteName) {
  // Create modal
  const modal = document.createElement('div');
  modal.className = 'graph-modal';
  modal.onclick = (e) => { if (e.target === modal) closeGraph(); };
  modal.innerHTML = `
    <div class="graph-modal-content">
      <button class="graph-modal-close" onclick="closeGraph()">&times;</button>
      <div class="graph-title">${siteName}</div>
      <div class="graph-subtitle">7-day water quality trends — Site ${siteId}</div>
      <div class="graph-container" style="position:relative;height:400px">
        <canvas id="qwChart"></canvas>
      </div>
      <div id="graphStatus" style="font-size:0.85em;color:#64748b">Loading 7-day data...</div>
    </div>
  `;
  document.body.appendChild(modal);

  try {
    let seriesData = historicalData[siteId];
    // If we don't have it cached, fetch it
    if (!seriesData || Object.keys(seriesData).length === 0) {
      const json = await fetchQW7Day(siteId);
      seriesData = parse7DayResponse(json);
      historicalData[siteId] = seriesData;
    }

    if (!seriesData || Object.keys(seriesData).length === 0) {
      document.getElementById('graphStatus').textContent = 'No 7-day data available for this site.';
      return;
    }

    renderChart(seriesData);
    document.getElementById('graphStatus').textContent = '';
  } catch (err) {
    document.getElementById('graphStatus').textContent = `Error: ${err.message}`;
  }
}

function closeGraph() {
  const modal = document.querySelector('.graph-modal');
  if (modal) modal.remove();
  if (chartInstance) { chartInstance.destroy(); chartInstance = null; }
}
function renderChart(seriesData) {
  const ctx = document.getElementById('qwChart').getContext('2d');
  const colors = {
    '00095': '#2563eb',  // blue - SC
    '00300': '#059669',  // green - DO
    '00400': '#7c3aed',  // purple - pH
    '63680': '#d97706',  // amber - Turbidity
    '00010': '#dc2626'   // red - Temperature
  };

  const datasets = [];
  for (const [paramCode, values] of Object.entries(seriesData)) {
    if (!QW_PARAMS[paramCode]) continue;
    // Determine which y-axis to use
    let yAxisID = 'y';
    if (paramCode === '63680') yAxisID = 'y1'; // Turbidity can be very different scale
    if (paramCode === '00400') yAxisID = 'y2'; // pH is 0-14

    datasets.push({
      label: `${QW_PARAMS[paramCode].abbr} (${QW_PARAMS[paramCode].unit || 'units'})`,
      data: values.map(v => ({ x: v.dateTime, y: v.value })),
      borderColor: colors[paramCode],
      backgroundColor: colors[paramCode] + '20',
      borderWidth: 1.5,
      pointRadius: 0,
      tension: 0.3,
      yAxisID: yAxisID
    });
  }

  // Build scales based on what params are present
  const scales = {
    x: {
      type: 'time',
      time: { unit: 'day', displayFormats: { day: 'MMM d', hour: 'MMM d HH:mm' } },
      title: { display: true, text: 'Date' }
    },
    y: {
      type: 'linear',
      position: 'left',
      title: { display: true, text: 'SC (µS/cm) / DO (mg/L) / Temp (°C)' },
      beginAtZero: false
    }
  };

  if (seriesData['63680']) {
    scales.y1 = {
      type: 'linear',
      position: 'right',
      title: { display: true, text: 'Turbidity (FNU)' },
      grid: { drawOnChartArea: false },
      beginAtZero: true
    };
  }
  if (seriesData['00400']) {
    scales.y2 = {
      type: 'linear',
      position: 'right',
      title: { display: true, text: 'pH' },
      grid: { drawOnChartArea: false },
      min: 5, max: 10
    };
  }

  if (chartInstance) chartInstance.destroy();
  chartInstance = new Chart(ctx, {
    type: 'line',
    data: { datasets },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      interaction: { mode: 'index', intersect: false },
      plugins: {
        legend: { position: 'top' },
        tooltip: { mode: 'index', intersect: false }
      },
      scales: scales
    }
  });
}

// ===== INIT =====
loadData();
