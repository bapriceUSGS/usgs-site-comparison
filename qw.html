// Inter-site comparison chains
const INTERSITE_CHAINS = {
    "Clark Fork": ["12323800","12324200","12324400","12340500"],
    "Tongue River": ["06306300","06307500","06307616","06307830","06308500"]
};

// Global alert storage
window._qwAlerts = [];
window._qwSiteData = {};
window._qw7dayData = {};

// ===== DATA FETCHING =====
async function fetchIVData(siteIds, paramCodes, period) {
    const results = {};
    const batches = [];
    for (let i = 0; i < siteIds.length; i += 20) {
        batches.push(siteIds.slice(i, i + 20));
    }
    for (const batch of batches) {
        const sites = batch.join(',');
        const params = paramCodes.join(',');
        const url = `https://waterservices.usgs.gov/nwis/iv/?format=json&sites=${sites}&parameterCd=${params}&period=${period}&siteStatus=all`;
        try {
            const resp = await fetch(url);
            if (!resp.ok) continue;
            const data = await resp.json();
            if (data.value && data.value.timeSeries) {
                for (const ts of data.value.timeSeries) {
                    const siteCode = ts.sourceInfo.siteCode[0].value;
                    const siteName = ts.sourceInfo.siteName;
                    const paramCode = ts.variable.variableCode[0].value;
                    if (!results[siteCode]) results[siteCode] = { name: siteName, params: {} };
                    const values = ts.values[0].value || [];
                    results[siteCode].params[paramCode] = values.map(v => ({
                        time: v.dateTime,
                        value: parseFloat(v.value)
                    })).filter(v => !isNaN(v.value) && v.value >= 0);
                }
            }
        } catch(e) { console.warn('Fetch error:', e); }
    }
    return results;
}

// Fetch historical daily statistics (mean, max, min for today's date)
// ALSO fetch 3/5/7 year overall max/min to detect all-time extremes
async function fetchHistoricalStats(siteIds, paramCodes) {
    const results = {};
    const batchSize = 20;
    const today = new Date();
    const todayMonth = today.getMonth() + 1;
    const todayDay = today.getDate();

    // Part 1: day-of-year stats - run ALL requests in parallel
    const statPromises = [];
    for (let i = 0; i < siteIds.length; i += batchSize) {
        const batch = siteIds.slice(i, i + batchSize);
        for (const statType of ['mean','max','min']) {
            for (const paramCd of paramCodes) {
                const url = `https://waterservices.usgs.gov/nwis/stat/?format=rdb&sites=${batch.join(',')}&parameterCd=${paramCd}&statReportType=daily&statTypeCd=${statType}`;
                statPromises.push(fetch(url).then(r => r.ok ? r.text() : '').then(text => ({text, statType, paramCd})).catch(() => ({text:'', statType, paramCd})));
            }
        }
    }
    const statResults = await Promise.all(statPromises);
    for (const {text, statType, paramCd} of statResults) {
        if (!text) continue;
        const lines = text.split('\n');
        let headers = null, skip = true;
        for (const line of lines) {
            if (line.startsWith('#')) continue;
            if (!headers) { headers = line.split('\t'); skip = true; continue; }
            if (skip) { skip = false; continue; }
            if (!line.trim()) continue;
            const f = line.split('\t');
            const si = headers.indexOf('site_no');
            const mi = headers.indexOf('month_nu');
            const di = headers.indexOf('day_nu');
            const vi = headers.indexOf('mean_va') >= 0 ? headers.indexOf('mean_va') : (headers.indexOf('max_va') >= 0 ? headers.indexOf('max_va') : headers.indexOf('min_va'));
            const ci = headers.indexOf('count_nu');
            const byi = headers.indexOf('begin_yr');
            const eyi = headers.indexOf('end_yr');
            if (si<0 || mi<0 || di<0 || vi<0) continue;
            const month = parseInt(f[mi]);
            const day = parseInt(f[di]);
            if (month !== todayMonth || day !== todayDay) continue;
            const sid = f[si]?.trim();
            const val = parseFloat(f[vi]);
            const count = parseInt(f[ci]) || 0;
            const beginYr = parseInt(f[byi]) || 0;
            const endYr = parseInt(f[eyi]) || 0;
            if (!sid || isNaN(val)) continue;
            if (!results[sid]) results[sid] = {};
            if (!results[sid][paramCd]) results[sid][paramCd] = {};
            results[sid][paramCd][statType] = val;
            results[sid][paramCd].count = count;
            results[sid][paramCd].beginYr = beginYr;
            results[sid][paramCd].endYr = endYr;
        }
    }

    // Part 2: 3/5/7 year DV extremes - run in parallel too
    const currentWY = today.getMonth() >= 9 ? today.getFullYear() + 1 : today.getFullYear();
    const periods = [
        {years: 3, startDT: `${currentWY - 3}-10-01`},
        {years: 5, startDT: `${currentWY - 5}-10-01`},
        {years: 7, startDT: `${currentWY - 7}-10-01`},
    ];
    const endDT = today.toISOString().split('T')[0];

    const dvPromises = [];
    for (const period of periods) {
        for (let i = 0; i < siteIds.length; i += 20) {
            const batch = siteIds.slice(i, i + 20);
            for (const paramCd of paramCodes) {
                for (const statCd of ['00003','00001']) {
                    const url = `https://waterservices.usgs.gov/nwis/dv/?format=json&sites=${batch.join(',')}&parameterCd=${paramCd}&startDT=${period.startDT}&endDT=${endDT}&statCd=${statCd}&siteStatus=all`;
                    dvPromises.push(fetch(url).then(r => r.ok ? r.json() : null).then(data => ({data, period, paramCd, statCd})).catch(() => ({data:null, period, paramCd, statCd})));
                }
            }
        }
    }
    const dvResults = await Promise.all(dvPromises);
    for (const {data, period, paramCd, statCd} of dvResults) {
        if (!data?.value?.timeSeries) continue;
        for (const ts of data.value.timeSeries) {
            const sid = ts.sourceInfo.siteCode[0].value;
            const vals = ts.values[0].value.map(v => parseFloat(v.value)).filter(v => !isNaN(v) && v > -999000);
            if (vals.length < 30) continue;
            if (!results[sid]) results[sid] = {};
            if (!results[sid][paramCd]) results[sid][paramCd] = {};
            if (statCd === '00003') {
                results[sid][paramCd][`meanMax${period.years}yr`] = Math.max(...vals);
                results[sid][paramCd][`meanMin${period.years}yr`] = Math.min(...vals.filter(v => v > 0));
            } else {
                results[sid][paramCd][`ivMax${period.years}yr`] = Math.max(...vals);
                results[sid][paramCd][`ivMin${period.years}yr`] = Math.min(...vals.filter(v => v >= 0));
            }
        }
    }

    return results;
}

async function loadAllData() {
    const allSiteIds = QW_DRAINAGES.flatMap(d => d.sites.map(s => s.id));
    const paramCodes = QW_PARAMS.map(p => p.code);

    // Fetch current and 7-day data IN PARALLEL (biggest speed win)
    const [currentData, weekData] = await Promise.all([
        fetchIVData(allSiteIds, paramCodes, 'PT2H'),
        fetchIVData(allSiteIds, paramCodes, 'P7D')
    ]);
    window._qwSiteData = currentData;
    window._qw7dayData = weekData;

    // Fetch historical stats (day-of-year only - skip multi-year DV on initial load)
    const histStats = await fetchHistoricalStats(allSiteIds, paramCodes);
    window._qwHistStats = histStats;

    return { currentData, weekData, histStats };
}
// ===== SPIKE DETECTION =====
function detectSpikes(currentData, weekData, histStats) {
    const spikes = [];
    for (const siteId of Object.keys(currentData)) {
        const siteInfo = currentData[siteId];
        for (const paramCode of Object.keys(siteInfo.params)) {
            const currentVals = siteInfo.params[paramCode];
            if (!currentVals || currentVals.length === 0) continue;
            const currentVal = currentVals[currentVals.length - 1].value;
            const param = QW_PARAMS.find(p => p.code === paramCode);

            // Out-of-range checks (impossible/suspect values)
            if (paramCode === '00010' && currentVal < -0.2) {
                spikes.push({ type:'spike', siteId, siteName:siteInfo.name, paramCode,
                    paramName:param?.name||paramCode, paramAbbr:param?.abbr||paramCode,
                    currentVal, median:0, ratio:0,
                    alertType:'Out of range: Temperature below -0.2°C'});
                continue;
            }
            if (paramCode === '00400' && (currentVal < 4 || currentVal > 11)) {
                spikes.push({ type:'spike', siteId, siteName:siteInfo.name, paramCode,
                    paramName:param?.name||paramCode, paramAbbr:param?.abbr||paramCode,
                    currentVal, median:0, ratio:0,
                    alertType:`Out of range: pH ${currentVal < 4 ? 'below 4' : 'above 11'}`});
                continue;
            }
            if (paramCode === '00300' && currentVal < 0) {
                spikes.push({ type:'spike', siteId, siteName:siteInfo.name, paramCode,
                    paramName:param?.name||paramCode, paramAbbr:param?.abbr||paramCode,
                    currentVal, median:0, ratio:0,
                    alertType:'Out of range: Negative DO value'});
                continue;
            }
            if (paramCode === '00095' && currentVal < 0) {
                spikes.push({ type:'spike', siteId, siteName:siteInfo.name, paramCode,
                    paramName:param?.name||paramCode, paramAbbr:param?.abbr||paramCode,
                    currentVal, median:0, ratio:0,
                    alertType:'Out of range: Negative SC value'});
                continue;
            }

            // Get 7-day data for context only (used for median in graphs, not for flagging)
            const weekSite = weekData[siteId];
            if (!weekSite || !weekSite.params[paramCode]) continue;
            const weekVals = weekSite.params[paramCode].map(v => v.value).sort((a, b) => a - b);
            if (weekVals.length < 10) continue;
            const median = weekVals[Math.floor(weekVals.length / 2)];

            // NO spike detection here - only flag based on 3/5/7 year extremes (below)
        }
    }

    // ===== PERIOD-OF-RECORD EXTREME CHECKS (water years: Oct 1 - Sep 30) =====
    // Only flag if:
    // 1) Current IV max > historical IV max in 3/5/7 water years (instantaneous vs instantaneous)
    // 2) Current 7-day median > historical mean max in 3/5/7 water years (median vs median)
    // 3) Same for lows
    if (histStats) {
        for (const siteId of Object.keys(currentData)) {
            const siteInfo = currentData[siteId];
            const weekSite = weekData[siteId];
            for (const paramCode of Object.keys(siteInfo.params)) {
                const currentVals = siteInfo.params[paramCode];
                if (!currentVals || currentVals.length === 0) continue;
                const param = QW_PARAMS.find(p => p.code === paramCode);
                const stats = histStats[siteId]?.[paramCode];
                if (!stats) continue;

                // Current instantaneous max and min (from last 2 hours)
                const ivValues = currentVals.map(v => v.value).filter(v => v >= 0);
                if (!ivValues.length) continue;
                const currentInstMax = Math.max(...ivValues);
                const currentInstMin = Math.min(...ivValues);

                // Current 7-day median (for median-vs-median)
                let currentMedian = null;
                if (weekSite && weekSite.params[paramCode]) {
                    const wVals = weekSite.params[paramCode].map(v => v.value).filter(v => v >= 0).sort((a,b) => a-b);
                    if (wVals.length > 10) currentMedian = wVals[Math.floor(wVals.length/2)];
                }

                // HIGH: Instantaneous vs Instantaneous (IV max vs historical IV max)
                if (stats.ivMax7yr && currentInstMax > stats.ivMax7yr) {
                    spikes.push({ type:'spike', siteId, siteName:siteInfo.name, paramCode,
                        paramName:param?.name||paramCode, paramAbbr:param?.abbr||paramCode,
                        currentVal:currentInstMax, median: currentMedian||0, ratio: 0,
                        alertType:`⚡ HIGHEST instantaneous ${param?.name||paramCode} in 7+ water years (prev max: ${stats.ivMax7yr.toFixed(1)})`});
                } else if (stats.ivMax5yr && currentInstMax > stats.ivMax5yr) {
                    spikes.push({ type:'spike', siteId, siteName:siteInfo.name, paramCode,
                        paramName:param?.name||paramCode, paramAbbr:param?.abbr||paramCode,
                        currentVal:currentInstMax, median: currentMedian||0, ratio: 0,
                        alertType:`⚡ HIGHEST instantaneous ${param?.name||paramCode} in 5+ water years (prev max: ${stats.ivMax5yr.toFixed(1)})`});
                } else if (stats.ivMax3yr && currentInstMax > stats.ivMax3yr) {
                    spikes.push({ type:'spike', siteId, siteName:siteInfo.name, paramCode,
                        paramName:param?.name||paramCode, paramAbbr:param?.abbr||paramCode,
                        currentVal:currentInstMax, median: currentMedian||0, ratio: 0,
                        alertType:`⚡ HIGHEST instantaneous ${param?.name||paramCode} in 3+ water years (prev max: ${stats.ivMax3yr.toFixed(1)})`});
                }

                // HIGH: Median vs Median (current median vs historical mean max)
                if (currentMedian !== null) {
                    if (stats.meanMax7yr && currentMedian > stats.meanMax7yr) {
                        spikes.push({ type:'spike', siteId, siteName:siteInfo.name, paramCode,
                            paramName:param?.name||paramCode, paramAbbr:param?.abbr||paramCode,
                            currentVal:currentMedian, median: currentMedian, ratio: 0,
                            alertType:`⚡ HIGHEST median ${param?.name||paramCode} in 7+ water years (prev median max: ${stats.meanMax7yr.toFixed(1)})`});
                    } else if (stats.meanMax5yr && currentMedian > stats.meanMax5yr) {
                        spikes.push({ type:'spike', siteId, siteName:siteInfo.name, paramCode,
                            paramName:param?.name||paramCode, paramAbbr:param?.abbr||paramCode,
                            currentVal:currentMedian, median: currentMedian, ratio: 0,
                            alertType:`⚡ HIGHEST median ${param?.name||paramCode} in 5+ water years (prev median max: ${stats.meanMax5yr.toFixed(1)})`});
                    } else if (stats.meanMax3yr && currentMedian > stats.meanMax3yr) {
                        spikes.push({ type:'spike', siteId, siteName:siteInfo.name, paramCode,
                            paramName:param?.name||paramCode, paramAbbr:param?.abbr||paramCode,
                            currentVal:currentMedian, median: currentMedian, ratio: 0,
                            alertType:`⚡ HIGHEST median ${param?.name||paramCode} in 3+ water years (prev median max: ${stats.meanMax3yr.toFixed(1)})`});
                    }

                    // LOW: Median vs Median
                    if (stats.meanMin7yr !== undefined && stats.meanMin7yr > 0 && currentMedian < stats.meanMin7yr) {
                        spikes.push({ type:'spike', siteId, siteName:siteInfo.name, paramCode,
                            paramName:param?.name||paramCode, paramAbbr:param?.abbr||paramCode,
                            currentVal:currentMedian, median: currentMedian, ratio: 0,
                            alertType:`⚡ LOWEST median ${param?.name||paramCode} in 7+ water years (prev median min: ${stats.meanMin7yr.toFixed(1)})`});
                    } else if (stats.meanMin5yr !== undefined && stats.meanMin5yr > 0 && currentMedian < stats.meanMin5yr) {
                        spikes.push({ type:'spike', siteId, siteName:siteInfo.name, paramCode,
                            paramName:param?.name||paramCode, paramAbbr:param?.abbr||paramCode,
                            currentVal:currentMedian, median: currentMedian, ratio: 0,
                            alertType:`⚡ LOWEST median ${param?.name||paramCode} in 5+ water years (prev median min: ${stats.meanMin5yr.toFixed(1)})`});
                    } else if (stats.meanMin3yr !== undefined && stats.meanMin3yr > 0 && currentMedian < stats.meanMin3yr) {
                        spikes.push({ type:'spike', siteId, siteName:siteInfo.name, paramCode,
                            paramName:param?.name||paramCode, paramAbbr:param?.abbr||paramCode,
                            currentVal:currentMedian, median: currentMedian, ratio: 0,
                            alertType:`⚡ LOWEST median ${param?.name||paramCode} in 3+ water years (prev median min: ${stats.meanMin3yr.toFixed(1)})`});
                    }
                }

                // LOW: Instantaneous vs Instantaneous
                if (stats.ivMin7yr !== undefined && stats.ivMin7yr > 0 && currentInstMin < stats.ivMin7yr) {
                    spikes.push({ type:'spike', siteId, siteName:siteInfo.name, paramCode,
                        paramName:param?.name||paramCode, paramAbbr:param?.abbr||paramCode,
                        currentVal:currentInstMin, median: currentMedian||0, ratio: 0,
                        alertType:`⚡ LOWEST instantaneous ${param?.name||paramCode} in 7+ water years (prev min: ${stats.ivMin7yr.toFixed(1)})`});
                } else if (stats.ivMin5yr !== undefined && stats.ivMin5yr > 0 && currentInstMin < stats.ivMin5yr) {
                    spikes.push({ type:'spike', siteId, siteName:siteInfo.name, paramCode,
                        paramName:param?.name||paramCode, paramAbbr:param?.abbr||paramCode,
                        currentVal:currentInstMin, median: currentMedian||0, ratio: 0,
                        alertType:`⚡ LOWEST instantaneous ${param?.name||paramCode} in 5+ water years (prev min: ${stats.ivMin5yr.toFixed(1)})`});
                } else if (stats.ivMin3yr !== undefined && stats.ivMin3yr > 0 && currentInstMin < stats.ivMin3yr) {
                    spikes.push({ type:'spike', siteId, siteName:siteInfo.name, paramCode,
                        paramName:param?.name||paramCode, paramAbbr:param?.abbr||paramCode,
                        currentVal:currentInstMin, median: currentMedian||0, ratio: 0,
                        alertType:`⚡ LOWEST instantaneous ${param?.name||paramCode} in 3+ water years (prev min: ${stats.ivMin3yr.toFixed(1)})`});
                }
            }
        }
    }

    return spikes;
}

// ===== INTER-SITE COMPARISON =====
function detectInterSiteAnomalies(weekData) {
    const anomalies = [];
    for (const [chainName, siteIds] of Object.entries(INTERSITE_CHAINS)) {
        for (let i = 0; i < siteIds.length - 1; i++) {
            const upId = siteIds[i];
            const downId = siteIds[i + 1];
            const upSite = weekData[upId];
            const downSite = weekData[downId];
            if (!upSite || !downSite) continue;
            for (const param of QW_PARAMS) {
                const upVals = upSite.params[param.code];
                const downVals = downSite.params[param.code];
                if (!upVals || !downVals || upVals.length < 10 || downVals.length < 10) continue;
                // Calculate current ratio vs historical ratio
                const upCurrent = upVals[upVals.length - 1].value;
                const downCurrent = downVals[downVals.length - 1].value;
                if (upCurrent === 0) continue;
                const currentRatio = downCurrent / upCurrent;
                // Historical median ratio
                const historicalRatios = [];
                const minLen = Math.min(upVals.length, downVals.length);
                for (let j = 0; j < minLen - 1; j++) {
                    if (upVals[j].value > 0) {
                        historicalRatios.push(downVals[j].value / upVals[j].value);
                    }
                }
                if (historicalRatios.length < 5) continue;
                historicalRatios.sort((a, b) => a - b);
                const medianRatio = historicalRatios[Math.floor(historicalRatios.length / 2)];
                if (medianRatio === 0) continue;
                const deviation = Math.abs(currentRatio - medianRatio) / medianRatio;
                if (deviation > 0.3) {
                    const upName = upSite.name || upId;
                    const downName = downSite.name || downId;
                    anomalies.push({
                        type: 'intersite',
                        chainName,
                        upId, downId,
                        upName, downName,
                        paramCode: param.code,
                        paramName: param.name,
                        paramAbbr: param.abbr,
                        currentRatio: currentRatio.toFixed(2),
                        medianRatio: medianRatio.toFixed(2),
                        deviation: (deviation * 100).toFixed(0)
                    });
                }
            }
        }
    }
    return anomalies;
}
// ===== CORRELATION CHECKS =====
function detectCorrelationAnomalies(currentData, weekData) {
    const anomalies = [];
    for (const siteId of Object.keys(currentData)) {
        const siteInfo = currentData[siteId];
        const weekSite = weekData[siteId];
        if (!weekSite) continue;
        // Check: temp up without DO down (sensor fouling indicator)
        const tempData = siteInfo.params['00010'];
        const doData = siteInfo.params['00300'];
        const weekTemp = weekSite.params['00010'];
        const weekDO = weekSite.params['00300'];
        if (tempData && doData && weekTemp && weekDO && tempData.length > 0 && doData.length > 0) {
            const currentTemp = tempData[tempData.length - 1].value;
            const currentDO = doData[doData.length - 1].value;
            const tempVals = weekTemp.map(v => v.value).sort((a, b) => a - b);
            const doVals = weekDO.map(v => v.value).sort((a, b) => a - b);
            if (tempVals.length > 10 && doVals.length > 10) {
                const tempMedian = tempVals[Math.floor(tempVals.length / 2)];
                const doMedian = doVals[Math.floor(doVals.length / 2)];
                if (tempMedian > 0 && doMedian > 0) {
                    const tempUp = (currentTemp - tempMedian) / tempMedian;
                    const doChange = (currentDO - doMedian) / doMedian;
                    // Temp significantly up but DO not down
                    if (tempUp > 0.15 && doChange > 0.05) {
                        anomalies.push({
                            type: 'correlation',
                            subtype: 'temp_do',
                            siteId,
                            siteName: siteInfo.name,
                            message: `Temp up ${(tempUp*100).toFixed(0)}% but DO also up ${(doChange*100).toFixed(0)}% - possible sensor issue`,
                            param1: '00010', param2: '00300'
                        });
                    }
                }
            }
        }
        // Check: turbidity spike without SC change (sensor fouling)
        const turbData = siteInfo.params['63680'];
        const scData = siteInfo.params['00095'];
        const weekTurb = weekSite.params['63680'];
        const weekSC = weekSite.params['00095'];
        if (turbData && scData && weekTurb && weekSC && turbData.length > 0 && scData.length > 0) {
            const currentTurb = turbData[turbData.length - 1].value;
            const currentSC = scData[scData.length - 1].value;
            const turbVals = weekTurb.map(v => v.value).sort((a, b) => a - b);
            const scVals = weekSC.map(v => v.value).sort((a, b) => a - b);
            if (turbVals.length > 10 && scVals.length > 10) {
                const turbMedian = turbVals[Math.floor(turbVals.length / 2)];
                const scMedian = scVals[Math.floor(scVals.length / 2)];
                if (turbMedian > 0 && scMedian > 0) {
                    const turbChange = (currentTurb - turbMedian) / turbMedian;
                    const scChange = Math.abs(currentSC - scMedian) / scMedian;
                    // Turbidity spiked but SC barely changed
                    if (turbChange > 0.5 && scChange < 0.1) {
                        anomalies.push({
                            type: 'correlation',
                            subtype: 'turb_sc',
                            siteId,
                            siteName: siteInfo.name,
                            message: `Turbidity up ${(turbChange*100).toFixed(0)}% but SC stable - possible sensor fouling`,
                            param1: '63680', param2: '00095'
                        });
                    }
                }
            }
        }
    }
    return anomalies;
}

function renderSummary(spikes, intersiteAlerts, correlationAlerts) {
    const total = spikes.length + intersiteAlerts.length + correlationAlerts.length;
    document.getElementById('summaryCards').innerHTML = `
        <div class="summary-card card-critical"><div class="number">${intersiteAlerts.length + correlationAlerts.length}</div><div class="label">Inter-site / Correlation</div></div>
        <div class="summary-card card-high"><div class="number">${spikes.length}</div><div class="label">Spike Alerts</div></div>
        <div class="summary-card card-ok"><div class="number">${QW_DRAINAGES.reduce((s,d)=>s+d.sites.length,0)}</div><div class="label">Sites Monitored</div></div>
    `;
}

function getCurrentValue(siteId, paramCode) {
    const site = window._qwSiteData[siteId];
    if (!site || !site.params[paramCode]) return null;
    const vals = site.params[paramCode];
    if (vals.length === 0) return null;
    return vals[vals.length - 1];
}

function getLatestTime(siteId) {
    const site = window._qwSiteData[siteId];
    if (!site) return null;
    let latest = null;
    for (const paramCode of Object.keys(site.params)) {
        const vals = site.params[paramCode];
        if (vals.length > 0) {
            const t = new Date(vals[vals.length - 1].time);
            if (!latest || t > latest) latest = t;
        }
    }
    return latest;
}

function isSpiked(siteId, paramCode, spikes) {
    return spikes.some(s => s.siteId === siteId && s.paramCode === paramCode);
}

function formatVal(val, paramCode, siteId, spikes) {
    if (val === null) return '<td class="val-na">—</td>';
    const v = val.value;
    if (v === undefined || v === null) return '<td class="val-na">N/A</td>';
    const spiked = isSpiked(siteId, paramCode, spikes);
    const display = paramCode === '00400' ? v.toFixed(1) : (v >= 100 ? Math.round(v) : v.toFixed(1));
    if (spiked) {
        return `<td class="val-num spike-flag">⚠ ${display}</td>`;
    }
    return `<td class="val-num">${display}</td>`;
}
function renderDrainages(spikes, intersiteAlerts, correlationAlerts) {
    const app = document.getElementById('app');
    let html = '';
    for (const drainage of QW_DRAINAGES) {
        const drainageAlerts = [
            ...spikes.filter(s => drainage.sites.some(ds => ds.id === s.siteId)),
            ...intersiteAlerts.filter(a => drainage.sites.some(ds => ds.id === a.upId || ds.id === a.downId)),
            ...correlationAlerts.filter(a => drainage.sites.some(ds => ds.id === a.siteId))
        ];
        const alertCount = drainageAlerts.length;
        const badge = alertCount > 0
            ? `<span class="badge badge-alert">${alertCount} alert${alertCount>1?'s':''}</span>`
            : `<span class="badge badge-ok">OK</span>`;
        html += `<div class="drainage-section">
            <div class="drainage-header" onclick="this.nextElementSibling.classList.toggle('hidden')">
                <span>${drainage.name}</span>${badge}
            </div>
            <div class="drainage-body">
                <table class="site-table">
                    <thead><tr>
                        <th>Site Name</th><th>Site #</th>
                        <th style="text-align:right">SC</th>
                        <th style="text-align:right">DO</th>
                        <th style="text-align:right">pH</th>
                        <th style="text-align:right">Turb</th>
                        <th style="text-align:right">Temp</th>
                        <th>Time</th>
                    </tr></thead><tbody>`;
        for (let si = 0; si < drainage.sites.length; si++) {
            const site = drainage.sites[si];
            const hasSpikeFlag = spikes.some(s => s.siteId === site.id);
            const rowClass = hasSpikeFlag ? 'flagged' : '';
            const sc = getCurrentValue(site.id, '00095');
            const doVal = getCurrentValue(site.id, '00300');
            const ph = getCurrentValue(site.id, '00400');
            const turb = getCurrentValue(site.id, '63680');
            const temp = getCurrentValue(site.id, '00010');
            const latestTime = getLatestTime(site.id);
            const timeStr = latestTime ? latestTime.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'}) : '—';
            // Store site index for onclick
            const siteIdx = drainage.sites.indexOf(site);
            html += `<tr class="${rowClass}" onclick="showGraph('${site.id}', ${JSON.stringify(site.name).replace(/'/g, "\\'")})" title="Click for 7-day graph">
                <td>${site.name}</td>
                <td style="font-family:monospace;font-size:0.8em">${site.id}</td>
                ${formatVal(sc, '00095', site.id, spikes)}
                ${formatVal(doVal, '00300', site.id, spikes)}
                ${formatVal(ph, '00400', site.id, spikes)}
                ${formatVal(turb, '63680', site.id, spikes)}
                ${formatVal(temp, '00010', site.id, spikes)}
                <td style="font-size:0.8em;color:#64748b">${timeStr}</td>
            </tr>`;
        }
        html += `</tbody></table>`;
        // Alerts section below table
        if (drainageAlerts.length > 0) {
            html += `<div style="margin-top:12px">`;
            for (const alert of drainageAlerts) {
                const idx = window._qwAlerts.length;
                window._qwAlerts.push(alert);
                let cls = 'spike';
                let title = '';
                let detail = '';
                if (alert.type === 'spike') {
                    cls = 'spike';
                    if (alert.alertType) {
                        title = `⚠ ${alert.alertType} - ${alert.siteName}`;
                        detail = `Current: ${alert.currentVal.toFixed(1)} ${alert.paramAbbr}`;
                    } else {
                        const pctAbove = ((alert.ratio - 1) * 100).toFixed(0);
                        const direction = alert.ratio > 1 ? 'above' : 'below';
                        const pctChange = alert.ratio > 1 ? pctAbove : ((1 - alert.ratio) * 100).toFixed(0);
                        title = `⚠ ${alert.paramName} ${pctChange}% ${direction} recent average - ${alert.siteName}`;
                        detail = `Current: ${alert.currentVal.toFixed(1)} | 7-day average: ${alert.median.toFixed(1)} | ${pctChange}% ${direction} normal for this week`;
                    }
                } else if (alert.type === 'intersite') {
                    cls = 'intersite';
                    title = `🔗 ${alert.chainName}: ${alert.paramAbbr} ratio anomaly`;
                    detail = `${alert.upName} → ${alert.downName} | Current ratio: ${alert.currentRatio} vs normal: ${alert.medianRatio} (${alert.deviation}% off)`;
                } else if (alert.type === 'correlation') {
                    cls = 'correlation';
                    title = `🔬 Correlation alert at ${alert.siteName}`;
                    detail = alert.message;
                }
                html += `<div class="alert-item ${cls}" onclick="showAlertGraph(window._qwAlerts[${idx}])">
                    <div class="alert-title">${title}</div>
                    <div class="alert-detail">${detail}</div>
                </div>`;
            }
            html += `<div class="click-hint">Click an alert to view graph</div></div>`;
        }
        html += `</div></div>`;
    }
    app.innerHTML = html;
}

                datasets.push({
                    label: p1 ? p1.name : alert.param1,
                    data: siteData.params[alert.param1].map(v => ({ x: new Date(v.time), y: v.value })),
                    borderColor: colors[0],
                    borderWidth: 2, pointRadius: 0, tension: 0.3,
                    yAxisID: 'y'
                });
            }
            if (siteData.params[alert.param2]) {
                datasets.push({
                    label: p2 ? p2.name : alert.param2,
                    data: siteData.params[alert.param2].map(v => ({ x: new Date(v.time), y: v.value })),
                    borderColor: colors[1],
                    borderWidth: 2, pointRadius: 0, tension: 0.3,
                    yAxisID: 'y1'
                });
            }
        }
    }

    const scales = { x: { type: 'time', time: { unit: 'day' } } };
    if (alert.type === 'correlation') {
        const p1 = QW_PARAMS.find(p => p.code === alert.param1);
        const p2 = QW_PARAMS.find(p => p.code === alert.param2);
        scales.y = { position: 'left', title: { display: true, text: p1 ? p1.name : '' } };
        scales.y1 = { position: 'right', title: { display: true, text: p2 ? p2.name : '' }, grid: { drawOnChartArea: false } };
    } else {
        scales.y = { position: 'left' };
    }

    new Chart(canvas, {
        type: 'line',
        data: { datasets },
        options: {
            responsive: true, maintainAspectRatio: false,
            interaction: { mode: 'index', intersect: false },
            scales,
            plugins: { legend: { position: 'bottom', labels: { boxWidth: 12, font: { size: 11 } } } }
        }
    });
}
// ===== MAIN =====
async function main() {
    const statusBar = document.getElementById('statusBar');
    try {
        statusBar.className = 'status-bar loading';
        statusBar.textContent = 'Fetching water quality data from USGS...';

        const { currentData, weekData, histStats } = await loadAllData();

        statusBar.textContent = 'Analyzing data for anomalies...';

        const spikes = detectSpikes(currentData, weekData, histStats);
        const intersiteAlerts = detectInterSiteAnomalies(weekData);
        const correlationAlerts = detectCorrelationAnomalies(currentData, weekData);

        renderSummary(spikes, intersiteAlerts, correlationAlerts);
        renderDrainages(spikes, intersiteAlerts, correlationAlerts);

        const totalAlerts = spikes.length + intersiteAlerts.length + correlationAlerts.length;
        const sitesReporting = Object.keys(currentData).length;
        statusBar.className = totalAlerts > 0 ? 'status-bar error' : 'status-bar success';
        statusBar.textContent = totalAlerts > 0
            ? `⚠ ${totalAlerts} alert(s) detected across ${sitesReporting} reporting sites. Last updated: ${new Date().toLocaleTimeString()}`
            : `✓ All ${sitesReporting} reporting sites within normal ranges. Last updated: ${new Date().toLocaleTimeString()}`;
    } catch(e) {
        statusBar.className = 'status-bar error';
        statusBar.textContent = `Error loading data: ${e.message}`;
        console.error(e);
    }
}

main();
</script>
