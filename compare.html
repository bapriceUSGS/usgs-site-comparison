const COLORS = ['#2563eb','#dc2626','#059669','#d97706','#7c3aed','#0891b2','#be185d','#4d7c0f','#6366f1','#ea580c'];

// Populate office dropdown
function initDropdowns() {
    const officeSelect = document.getElementById('officeSelect');
    officeSelect.innerHTML = '<option value="all">-- All Offices --</option>';
    for (const office of Object.keys(OFFICE_GROUPS)) {
        const opt = document.createElement('option');
        opt.value = office;
        opt.textContent = office;
        officeSelect.appendChild(opt);
    }
    updateGroupDropdown();
}

// Update group dropdown based on selected office
function updateGroupDropdown() {
    const officeSelect = document.getElementById('officeSelect');
    const groupSelect = document.getElementById('groupSelect');
    const office = officeSelect.value;

    groupSelect.innerHTML = '<option value="all">-- All Groups --</option>';

    let groups;
    if (office === 'all') {
        // Show all groups from all offices, prefixed with office name
        for (const [officeName, officeGroups] of Object.entries(OFFICE_GROUPS)) {
            officeGroups.forEach((g, i) => {
                const opt = document.createElement('option');
                opt.value = `${officeName}::${i}`;
                opt.textContent = `[${officeName}] ${g.name}`;
                groupSelect.appendChild(opt);
            });
        }
    } else {
        groups = OFFICE_GROUPS[office] || [];
        groups.forEach((g, i) => {
            const opt = document.createElement('option');
            opt.value = `${office}::${i}`;
            opt.textContent = g.name;
            groupSelect.appendChild(opt);
        });
    }
}

// Get selected groups based on dropdowns
function getSelectedGroups() {
    const groupSelect = document.getElementById('groupSelect');
    const officeSelect = document.getElementById('officeSelect');
    const groupVal = groupSelect.value;
    const officeVal = officeSelect.value;

    if (groupVal === 'all') {
        // All groups for the selected office (or all offices)
        if (officeVal === 'all') {
            return Object.values(OFFICE_GROUPS).flat();
        } else {
            return OFFICE_GROUPS[officeVal] || [];
        }
    } else {
        // Specific group: "OfficeName::index"
        const [officeName, idxStr] = groupVal.split('::');
        const idx = parseInt(idxStr);
        const groups = OFFICE_GROUPS[officeName] || [];
        return groups[idx] ? [groups[idx]] : [];
    }
}

async function fetchIV(siteIds, period) {
    const results = {};
    const url = `https://waterservices.usgs.gov/nwis/iv/?format=json&sites=${siteIds.join(',')}&parameterCd=00060&period=${period}&siteStatus=active`;
    try {
        const resp = await fetch(url);
        if (!resp.ok) return results;
        const data = await resp.json();
        for (const ts of (data?.value?.timeSeries || [])) {
            const sid = ts.sourceInfo.siteCode[0].value;
            const vals = ts.values[0].value || [];
            results[sid] = vals.map(v => ({
                time: new Date(v.dateTime).getTime(),
                value: parseFloat(v.value)
            })).filter(v => !isNaN(v.value) && v.value >= 0);
        }
    } catch(e) { console.warn(e); }
    return results;
}

function buildChart(container, group, data) {
    const section = document.createElement('div');
    section.className = 'chart-section';
    section.innerHTML = `<h3>${group.name}</h3><div class="chart-container"><canvas></canvas></div>`;
    container.appendChild(section);

    const canvas = section.querySelector('canvas');
    const datasets = [];
    group.sites.forEach((sid, i) => {
        const vals = data[sid];
        if (!vals || vals.length === 0) return;
        const name = SITE_NAMES[sid] || sid;
        datasets.push({
            label: name,
            data: vals.map(v => ({x: v.time, y: v.value})),
            borderColor: COLORS[i % COLORS.length],
            borderWidth: 1.5,
            pointRadius: 0,
            tension: 0.2,
            fill: false
        });
    });

    // Add computed sum lines if defined
    if (group.sums) {
        for (const sum of group.sums) {
            const sitesData = sum.addSites.map(sid => data[sid]).filter(Boolean);
            if (sitesData.length < 2) continue;

            const baseData = sitesData[0];
            const sumData = [];
            for (const point of baseData) {
                let total = point.value;
                let allHaveData = true;
                for (let s = 1; s < sitesData.length; s++) {
                    const other = sitesData[s];
                    const closest = other.reduce((prev, curr) =>
                        Math.abs(curr.time - point.time) < Math.abs(prev.time - point.time) ? curr : prev
                    );
                    if (Math.abs(closest.time - point.time) < 30*60*1000) {
                        total += closest.value;
                    } else {
                        allHaveData = false;
                    }
                }
                if (allHaveData) {
                    sumData.push({x: point.time, y: total});
                }
            }

            if (sumData.length > 0) {
                datasets.push({
                    label: sum.name,
                    data: sumData,
                    borderColor: '#000000',
                    borderWidth: 2.5,
                    borderDash: [8, 4],
                    pointRadius: 0,
                    tension: 0.2,
                    fill: false
                });
            }
        }
    }

    if (datasets.length === 0) {
        section.innerHTML += '<p style="color:#94a3b8;font-style:italic;padding:10px">No data available for this group.</p>';
        return;
    }

    new Chart(canvas, {
        type: 'line',
        data: { datasets },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            interaction: { mode: 'index', intersect: false },
            scales: {
                x: { type: 'time', time: { displayFormats: { hour: 'MMM d, ha', day: 'MMM d' } } },
                y: { title: { display: true, text: 'Discharge (cfs)' }, beginAtZero: false }
            },
            plugins: { legend: { position: 'bottom', labels: { boxWidth: 12, font: { size: 11 } } } }
        }
    });
}

async function loadComparisons() {
    const btn = document.getElementById('loadBtn');
    const status = document.getElementById('status');
    const chartsDiv = document.getElementById('charts');
    const period = document.getElementById('periodSelect').value;

    btn.disabled = true;
    btn.textContent = 'Loading...';
    status.style.display = 'block';
    status.className = 'status-bar loading';
    chartsDiv.innerHTML = '';

    const groups = getSelectedGroups();

    if (groups.length === 0) {
        status.className = 'status-bar error';
        status.textContent = 'No groups found for selected office.';
        btn.disabled = false;
        btn.textContent = 'Load';
        return;
    }

    try {
        const allSites = [...new Set(groups.flatMap(g => g.sites))];
        status.textContent = `Fetching discharge data for ${allSites.length} sites...`;

        const data = await fetchIV(allSites, period);
        const reporting = Object.keys(data).length;

        status.textContent = `Building charts...`;

        for (const group of groups) {
            buildChart(chartsDiv, group, data);
        }

        status.className = 'status-bar success';
        status.textContent = `${reporting} sites loaded. ${groups.length} comparison(s) displayed.`;
    } catch(e) {
        status.className = 'status-bar error';
        status.textContent = `Error: ${e.message}`;
    }

    btn.disabled = false;
    btn.textContent = 'Load';
}

// Initialize and auto-load
initDropdowns();
loadComparisons();
